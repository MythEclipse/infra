# Dependabot for asepharyana/infra.
#
# This repo holds ONLY infrastructure-as-code: Caddy configs, firewall scripts,
# prometheus targets, systemd units. It has NO package.json, no lockfile and no
# language manifests anywhere in the tree, so a `npm` entry can never resolve —
# it failed daily with `/package.json not found`.
#
# The repo does consume GitHub Actions, so that is the only ecosystem kept here.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
